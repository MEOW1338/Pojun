# Windows（Docker Desktop / WSL2 后端）专用覆盖配置。
#
# 用法（与主 compose 一起生效）：
#   cp .env.example .env      # 至少改 POSTGRES_PASSWORD
#   docker compose -f docker-compose.yml -f docker-compose.windows.yml up -d
#
# 为什么需要这份覆盖：
# 主 compose 把 data/ 以 bind mount 挂进容器。在 Linux 上这是"宿主机直接
# 查看/备份"的便利；但在 Windows 上 bind mount 走 NTFS ↔ WSL2 I/O 通道，
# 小文件读写实测慢两个数量级（500 个 4KB 文件：写 ~108 倍 / 读 ~328 倍），
# 而 Pojun 的流量记录、证据附件、任务工作区都是小文件密集型——必须避开。
# 这里把 data/ 换成 named volume（落在 WSL2 的 linux 文件系统里，性能与
# 容器层一致）。备份改用：
#   docker run --rm -v pojun-data:/data -v "%cd%:/backup" alpine \
#     tar czf /backup/pojun-data.tgz -C /data .
#
# skills/ 保留 bind mount：技能文件是少量只读小文件，NTFS 读损耗可接受，
# 保留它换来"改 skill 不用重建镜像"的便利。
#
# 回连接收器（reverse shell）注意：容器内 direct 模式解析出的 LHOST 是
# 容器网段 IP，外部目标连不到。Windows 部署请在「监听器 / C2」页把出口
# 形态设为 manual、地址填 Windows 宿主机的局域网 IP，并放开下方回连端口
# 映射（端口 1:1 对应，例如监听 4444 就映射 4444:4444）。

services:
  pojun:
    volumes:
      # 覆盖主 compose 的 ./data:/app/data —— 同 target 时以本文件为准
      - pojun-data:/app/data
    ports:
      # 回连端口范围映射（按需增删；manual 模式下 LHOST 填宿主机 IP）：
      - "4444-4450:4444-4450"

volumes:
  pojun-data:
